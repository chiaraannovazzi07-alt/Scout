function vStat(){
const L=S.log.filter(e=>(sf=="all"||e.s==sf)&&!e.o==!tmS);
let h=`<div class="row">${bt("tms","0","Noi",!tmS?"on":"")}${bt("tms","1","Avversari",tmS?"on":"")}</div><div class="row">${bt("ss","T","Traiettorie",ts=="T"?"on":"")}${bt("ss","G","Azioni per giocatrice",ts=="G"?"on":"")}${bt("ss","V","Rivedi video",ts=="V"?"on":"")}${bt("ss","*","Sintesi",ts=="*"?"on":"")}${Object.keys(SK).map(k=>bt("ss",k,SK[k][0],ts==k?"on":"")).join("")}</div><select data-c="sfl"><option value="all">Tutti i set</option>${[1,2,3,4,5].map(n=>`<option value="${n}"${sf==n?" selected":""}>Set ${n}</option>`).join("")}</select><div style="height:10px"></div>`;
if(ts=="T"){const es=L.filter(e=>e.k==tk&&e.tr&&(tp=="all"||e.p==tp));h+=`<div class="row">${bt("tk","A","Attacco",tk=="A"?"on":"")}${bt("tk","B","Battuta",tk=="B"?"on":"")}</div><select data-c="tp"><option value="all">Tutte</option>${(tmS?S.op:S.pl).map(p=>`<option value="${esc(p.n)}"${tp==p.n?" selected":""}>${esc(p.n+" "+p.name)}</option>`).join("")}</select><div style="height:10px"></div>`+cs(es.map(e=>ln(e.tr,GC[e.g]||"#8a8f98")).join(""))+`<p class="sm2">${es.length} traiettorie · verde punto, rosso errore, arancio murato, blu positivo, grigio altro.</p>`}else if(ts=="G"){const es=L.filter(e=>SK[e.k]&&(vsk=="all"||e.k==vsk)&&(vgd=="all"||e.g==vgd)),G={};es.forEach(e=>{(G[e.p]=G[e.p]||[]).push(e)});const R=tmS?S.op:S.pl,ks=Object.keys(G).sort((a,b)=>R.findIndex(x=>x.n==a)-R.findIndex(x=>x.n==b));h+=`<select data-c="vk"><option value="all">Tutti i fondamentali</option>${Object.keys(SK).map(k=>`<option value="${k}"${vsk==k?" selected":""}>${SK[k][0]}</option>`).join("")}</select><div style="height:6px"></div><select data-c="vg"><option value="all">Tutti gli esiti</option>${["#","+","!","-","/","="].map(g=>`<option value="${g}"${vgd==g?" selected":""}>${g}</option>`).join("")}</select><p class="sm2">${es.length} azioni di ${ks.length} giocatrici · tocca ▶ per rivedere il video (parte 4 s prima)</p>`+(ks.map(k=>{const a=G[k],n=a.length,c=a.filter(e=>e.g=="#").length,p=a.filter(e=>e.g=="#"||e.g=="+").length;return `<div class="lbl" style="margin-top:12px">${esc(pn(k,tmS))} · ${n} azioni · # ${pc(c,n)} · Pos ${pc(p,n)}</div><div class="log">${a.map(e=>{const t=sT(e);return `<div${t!==""?` data-a="seek" data-v="${t}" style="cursor:pointer"`:""}>${t!==""?"▶":"·"} Set ${e.s} · ${SK[e.k][0]} <b>${e.g}</b> ${Object.values(e.m).filter(Boolean).join("/")}</div>`}).join("")}</div>`}).join("")||'<span class="sm2">Nessuna azione</span>')}else if(ts=="V"){const es=L.filter(e=>SK[e.k]&&(vsk=="all"||e.k==vsk)&&(tp=="all"||e.p==tp)&&(vgd=="all"||e.g==vgd));h+=`<select data-c="vk"><option value="all">Tutti i fondamentali</option>${Object.keys(SK).map(k=>`<option value="${k}"${vsk==k?" selected":""}>${SK[k][0]}</option>`).join("")}</select><div style="height:6px"></div><select data-c="tp"><option value="all">Tutte le giocatrici</option>${(tmS?S.op:S.pl).map(p=>`<option value="${esc(p.n)}"${tp==p.n?" selected":""}>${esc(p.n+" "+p.name)}</option>`).join("")}</select><div style="height:6px"></div><select data-c="vg"><option value="all">Tutti gli esiti</option>${["#","+","!","-","/","="].map(g=>`<option value="${g}"${vgd==g?" selected":""}>${g}</option>`).join("")}</select><div class="lbl">${es.length} azioni · tocca per rivedere (parte 4 s prima)</div><div class="log">${es.slice(-200).reverse().map(e=>{const t=sT(e);return `<div${t!==""?` data-a="seek" data-v="${t}" style="cursor:pointer"`:""}>${t!==""?"▶":"·"} Set ${e.s} · ${esc(pn(e.p,e.o))} · ${SK[e.k][0]} <b>${e.g}</b></div>`}).join("")||'<span class="sm2">Nessuna azione</span>'}</div>`}else if(ts=="*"){
const PS=S.log.filter(e=>e.pt!==undefined&&(sf=="all"||e.s==sf)),w=a=>a.filter(e=>e.pt==1).length,so=PS.filter(e=>!e.sv),bp=PS.filter(e=>e.sv),cell=a=>`${w(a)}/${a.length} · ${pc(w(a),a.length)}`;
const sets=S.sets.map(x=>`Set ${x.s}: ${x.us}–${x.th}`).concat(S.us+S.th?[`Set ${S.set} (in corso): ${S.us}–${S.th}`]:[]).join(" · ")||"Nessun set";
h+=`<p class="sm2">${sets}</p><div class="tw"><table><tr><th></th><th>Side-out</th><th>Break</th></tr><tr class="t"><td>Totale</td><td>${cell(so)}</td><td>${cell(bp)}</td></tr>${[1,2,3,4,5,6].map(r=>`<tr><td>Rot ${r}</td><td>${cell(so.filter(e=>e.r==r))}</td><td>${cell(bp.filter(e=>e.r==r))}</td></tr>`).join("")}</table></div><p class="sm2">Side-out: punti vinti quando battono loro. Break: punti vinti quando battiamo noi.</p>
<div class="lbl">Squadra per fondamentale</div><div class="tw"><table><tr><th></th><th>Tot</th><th>#%</th><th>Pos%</th><th>Err</th></tr>`+Object.keys(SK).map(k=>{const c=cnt(L.filter(e=>e.k==k),k);return c.t?`<tr><td>${SK[k][0]}</td><td>${c.t}</td><td>${pc(c["#"],c.t)}</td><td>${pc(c["#"]+c["+"],c.t)}</td><td>${c["="]}</td></tr>`:""}).join("")+"</table></div>"}
else{
const es=L.filter(e=>e.k==ts),opts=[["p","Giocatrice"],["r","Rotazione"],["q","Posizione"],["s","Set"],...SK[ts][2].map(m=>[m[0],m[1]])];
if(!opts.some(o=>o[0]==by))by="p";
const key=e=>by=="p"?e.p:by=="r"?(e.r?"Rot "+e.r:"–"):by=="q"?(e.q?"P"+e.q:e.o?"–":"Panca"):by=="s"?"Set "+e.s:e.m[by]||"–",G={};
es.forEach(e=>{(G[key(e)]=G[key(e)]||[]).push(e)});
const ks=Object.keys(G).sort(by=="p"?(a,b)=>(tmS?S.op:S.pl).findIndex(x=>x.n==a)-(tmS?S.op:S.pl).findIndex(x=>x.n==b):(a,b)=>a.localeCompare(b,"it",{numeric:true}));
h+=`<select data-c="by">${opts.map(o=>`<option value="${o[0]}"${by==o[0]?" selected":""}>Per ${o[1].toLowerCase()}</option>`).join("")}</select><div style="height:10px"></div>`+tbl(ts,[...ks.map(k=>[by=="p"?esc(pn(k,tmS)):k,cnt(G[k],ts),""]),["SQUADRA",cnt(es,ts),"t"]]);
h+=`<p class="sm2">Pos% = # + “+”.${ts=="A"||ts=="B"?" Eff% = (# − murati − errori) / totale.":""}</p>`}
h+=`<div class="row">${bt("cv","","Esporta CSV")}</div>`;
if(cv){const o="Set;Squadra;Numero;Nome;Fondamentale;Esito;Rotazione;Posizione;Dettagli;Punto;Traiettoria;Tempo video\n"+L.filter(e=>e.p).map(e=>[e.s,e.o?"Avversari":"Noi",e.p,P(e.p,e.o).name,SK[e.k][0],e.g,e.r,e.q||"",Object.values(e.m).filter(Boolean).join("/"),e.pt===undefined?"":e.pt?"noi":"loro",e.tr?e.tr.join(" "):"",sT(e)].join(";")).join("\n");h+=`<textarea readonly onclick="this.select()">${esc(o)}</textarea><p class="sm2">Tocca, copia e incolla in Excel o Numbers.</p>`}
return h}
function vTeam(){return `<p class="sm2">Una riga per giocatrice: numero, nome, ruolo (P palleggio, S banda, O opposta, C centrale, L libero). Es. “7 Giulia S”.</p><textarea id="ro">${esc(S.pl.map(p=>p.n+(p.name?" "+p.name:"")+(p.r?" "+p.r:"")).join("\n"))}</textarea><div class="row" style="margin-top:8px">${bt("sr","","Salva squadra","on")}</div><div class="lbl">Avversari: numero e nome (facoltativo)</div><textarea id="op" style="min-height:110px">${esc(S.op.map(p=>p.n+(p.name?" "+p.name:"")).join("\n"))}</textarea><div class="row" style="margin-top:8px">${bt("so","","Salva avversari","on")}</div><div class="lbl">Formazione iniziale: P1 P2 P3 P4 P5 P6</div><input id="fo" value="${esc(S.lu.join(" "))}"><div class="row" style="margin-top:8px">${bt("fo","","Imposta formazione","on")}</div><div class="lbl">Formazione iniziale avversari: P1 P2 P3 P4 P5 P6</div><input id="fo2" value="${esc(S.ol.join(" "))}"><div class="row" style="margin-top:8px">${bt("fo2","","Imposta formazione avversari","on")}${bt("nm","",rst?"Confermi? Cancella tutto":"Nuova partita")}</div><p class="sm2">P1 è chi batte. Scrivi la formazione con le centrali: il libero (ruolo L) entra e esce da solo al loro posto in seconda linea. Quando conquisti il punto in ricezione la rotazione scatta da sola. Punti automatici: # in attacco, muro e battuta = punto noi; = e attacco murato = punto loro.</p>`}
function render(){$("tabs").innerHTML=[["scout","Scout"],["stat","Statistiche"],["team","Squadra"]].map(([a,l])=>bt("tab",a,l,tab==a?"on":"")).join("")+bt("vid","","🎬 Video",$("vw").style.display=="none"?"":"on");$("v").innerHTML=tab=="scout"?vScout():tab=="stat"?vStat():vTeam()}
render();
</script></body></html>
